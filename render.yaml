# Render Blueprint: https://render.com/docs/blueprint-spec
# Free plan: the instance has no persistent disk, so accounts & comments are stored in
# MongoDB (a free MongoDB Atlas cluster) via MONGODB_URI.
services:
  - type: web
    name: zemahub-orthodox
    runtime: node
    plan: free
    # --include=dev: the build needs devDependencies (esbuild) even though NODE_ENV=production.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist/server.cjs
    healthCheckPath: /api/stats
    # The Android app lives in mobile/; changes there don't need a website redeploy.
    buildFilter:
      ignoredPaths:
        - mobile/**
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # SHA-256 fingerprint of the Android app signing key (for App Links); set after the first app build.
      - key: ANDROID_SHA256_FINGERPRINTS
        sync: false
      - key: ADMIN_NAME
        value: ZemaHub Admin
