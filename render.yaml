# Render Blueprint: https://render.com/docs/blueprint-spec
# Free plan: the instance has no persistent disk, so accounts & comments are stored in
# MongoDB (a free MongoDB Atlas cluster) via MONGODB_URI.
services:
  - type: web
    name: zemahub-orthodox
    runtime: node
    plan: free
    # --include=dev: the build needs devDependencies (esbuild) even though NODE_ENV=production.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist/server.cjs
    healthCheckPath: /api/stats
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: ZemaHub Admin
